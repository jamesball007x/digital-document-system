<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ระบบจัดการเอกสารดิจิทัลพร้อมการลงนามอิเล็กทรอนิกส์อัจฉริยะ">
  <title>DocMS - ระบบจัดการเอกสารดิจิทัล</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.9/dist/pdf-lib.min.js"></script>
</head>

<body>
  <div id="toastContainer" class="toast-container"></div>
  <!-- LOGIN PAGE -->
  <div id="loginPage" class="login-page">
    <div class="login-bg">
      <div class="login-bg-shape shape1"></div>
      <div class="login-bg-shape shape2"></div>
      <div class="login-bg-shape shape3"></div>
    </div>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">
            <i class="fas fa-file-shield"></i>
          </div>
          <h1>DocMS</h1>
          <p>ระบบจัดการเอกสารดิจิทัลพร้อมลงนามอิเล็กทรอนิกส์</p>
        </div>
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="username"><i class="fas fa-user"></i> ชื่อผู้ใช้</label>
            <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> รหัสผ่าน</label>
            <div class="password-wrapper"><input type="password" id="password" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password"><button type="button" class="pw-toggle" onclick="togglePw(this)" tabindex="-1"><i class="fas fa-eye"></i></button></div>
          </div>
          <div id="loginSuccess" class="login-success" style="display:none;"></div>
          <div id="loginError" class="login-error" style="display:none;"></div>
          <button type="submit" class="btn-login" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
          </button>
          <div style="text-align:center;margin-top:16px;display:flex;justify-content:center;gap:16px">
            <a href="#" id="showForgotPw" style="color:var(--accent-orange);font-size:13px;text-decoration:none"><i
                class="fas fa-key"></i> ลืมรหัสผ่าน?</a>
            <a href="#" id="showRegister" style="color:var(--accent-blue);font-size:13px;text-decoration:none"><i
                class="fas fa-user-plus"></i> สมัครสมาชิกใหม่</a>
          </div>
        </form>

        <!-- FORGOT PASSWORD FORM -->
        <form id="forgotPwForm" class="login-form" style="display:none;">
          <div style="text-align:center;margin-bottom:16px">
            <div
              style="width:50px;height:50px;border-radius:50%;background:var(--accent-orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px">
              <i class="fas fa-key"></i></div>
            <h3 style="margin:0;font-size:18px">ลืมรหัสผ่าน</h3>
            <p style="color:var(--text-muted);font-size:13px;margin-top:4px">กรอกชื่อผู้ใช้และอีเมลที่ลงทะเบียนไว้</p>
          </div>
          <div class="form-group">
            <label><i class="fas fa-user"></i> ชื่อผู้ใช้</label>
            <input type="text" id="forgotUsername" placeholder="กรอกชื่อผู้ใช้" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-envelope"></i> อีเมลที่ลงทะเบียน</label>
            <input type="email" id="forgotEmail" placeholder="กรอกอีเมลที่ลงทะเบียนไว้" required>
          </div>
          <div id="forgotPwResult"
            style="display:none;padding:12px;border-radius:8px;margin-bottom:12px;font-size:13px"></div>
          <div id="forgotError" class="login-error" style="display:none;"></div>
          <button type="submit" class="btn-login" style="background:var(--accent-orange)">
            <i class="fas fa-undo"></i> รีเซ็ตรหัสผ่าน
          </button>
          <div style="text-align:center;margin-top:16px">
            <a href="#" id="showLoginFromForgot" style="color:var(--accent-blue);font-size:13px;text-decoration:none"><i
                class="fas fa-sign-in-alt"></i> กลับไปเข้าสู่ระบบ</a>
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="login-form" style="display:none;">
          <div class="form-group">
            <label><i class="fas fa-user"></i> ชื่อ-นามสกุล *</label>
            <input type="text" id="regName" placeholder="กรอกชื่อ-นามสกุล" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-user-tag"></i> ชื่อผู้ใช้ *</label>
            <input type="text" id="regUsername" placeholder="กรอกชื่อผู้ใช้สำหรับเข้าสู่ระบบ" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-envelope"></i> อีเมล</label>
            <input type="email" id="regEmail" placeholder="กรอกอีเมล (ไม่จำเป็น)">
          </div>
          <div class="form-group">
            <label><i class="fas fa-building"></i> แผนก</label>
            <input type="text" id="regDept" placeholder="กรอกแผนก (ไม่จำเป็น)">
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> รหัสผ่าน * <span
                style="font-size:11px;color:var(--text-muted)">(อย่างน้อย 8 ตัว มีตัวเลข)</span></label>
            <div class="password-wrapper"><input type="password" id="regPassword" placeholder="กรอกรหัสผ่าน" required><button type="button" class="pw-toggle" onclick="togglePw(this)" tabindex="-1"><i class="fas fa-eye"></i></button></div>
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> ยืนยันรหัสผ่าน *</label>
            <div class="password-wrapper"><input type="password" id="regPassword2" placeholder="กรอกรหัสผ่านอีกครั้ง" required><button type="button" class="pw-toggle" onclick="togglePw(this)" tabindex="-1"><i class="fas fa-eye"></i></button></div>
          </div>
          <div id="registerError" class="login-error" style="display:none;"></div>
          <button type="submit" class="btn-login" style="background:var(--accent-green)">
            <i class="fas fa-user-plus"></i> สมัครสมาชิก
          </button>
          <div style="text-align:center;margin-top:16px">
            <a href="#" id="showLogin" style="color:var(--accent-blue);font-size:13px;text-decoration:none"><i
                class="fas fa-sign-in-alt"></i> มีบัญชีแล้ว? เข้าสู่ระบบ</a>
          </div>
        </form>

        <div class="demo-accounts">
          <p><i class="fas fa-info-circle"></i> บัญชีทดสอบ:</p>
          <div class="demo-grid">
            <button class="demo-btn" data-user="admin" data-pass="admin123">
              <i class="fas fa-user-shield"></i>
              <span>ผู้ดูแลระบบ</span>
            </button>
            <button class="demo-btn" data-user="secretary" data-pass="sec123">
              <i class="fas fa-user-edit"></i>
              <span>ธุรการ</span>
            </button>
            <button class="demo-btn" data-user="user1" data-pass="user123">
              <i class="fas fa-user"></i>
              <span>ผู้ใช้ทั่วไป</span>
            </button>
            <button class="demo-btn" data-user="executive" data-pass="exec123">
              <i class="fas fa-user-tie"></i>
              <span>ผู้บริหาร</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appPage" class="app-page" style="display:none;">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="fas fa-file-shield"></i>
          <span>DocMS</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Dynamic menu based on role -->
      </nav>
      <div class="sidebar-user" id="sidebarUser">
        <!-- Dynamic user info -->
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
          </button>
          <div class="breadcrumb" id="breadcrumb">
            <span>แดชบอร์ด</span>
          </div>
        </div>
        <div class="top-bar-right">
          <div class="top-bar-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="ค้นหาเอกสาร..." id="globalSearch">
          </div>
          <div class="zoom-controls" id="zoomControls">
            <button class="zoom-btn" id="zoomOutBtn" title="ซูมออก (Ctrl -)">
              <i class="fas fa-minus"></i>
            </button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" id="zoomInBtn" title="ซูมเข้า (Ctrl +)">
              <i class="fas fa-plus"></i>
            </button>
            <button class="zoom-btn zoom-reset" id="zoomResetBtn" title="รีเซ็ต (Ctrl 0)">
              <i class="fas fa-undo"></i>
            </button>
          </div>
          <div class="notification-bell" id="notificationBell">
            <i class="fas fa-bell"></i>
            <span class="notification-badge" id="notifBadge">3</span>
          </div>
          <div class="user-menu" id="userMenu">
            <div class="user-avatar" id="userAvatar">
              <i class="fas fa-user"></i>
            </div>
            <div class="user-dropdown" id="userDropdown" style="display:none;">
              <div class="dropdown-header" id="dropdownHeader"></div>
              <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</a>
            </div>
          </div>
        </div>
      </header>

      <div class="content-area" id="contentArea">
        <!-- Dynamic content loaded here -->
      </div>
    </main>
  </div>

  <!-- MODALS -->
  <div id="modal" class="modal-overlay" style="display:none;">
    <div class="modal-content" id="modalContent">
      <!-- Dynamic modal content -->
    </div>
  </div>

  <!-- SIGNATURE MODAL -->
  <div id="signModal" class="modal-overlay" style="display:none;">
    <div class="modal-content signature-modal" style="max-width:550px">
      <div class="modal-header">
        <h3><i class="fas fa-signature"></i> ลงนามและอนุมัติเอกสาร</h3>
        <button class="modal-close" id="closeSignModal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <p id="signDocTitle" style="font-weight:600;margin-bottom:16px;color:var(--text-primary)"></p>
        
        <!-- Tab Navigation -->
        <div class="sig-tabs" style="display:flex;gap:8px;border-bottom:1px solid var(--border-color);margin-bottom:16px">
          <button type="button" class="sig-tab-btn active" data-tab="draw" style="padding:8px 16px;border:none;background:none;border-bottom:2px solid var(--accent-blue);color:var(--accent-blue);font-weight:600;cursor:pointer"><i class="fas fa-pen"></i> วาดด้วยเมาส์</button>
          <button type="button" class="sig-tab-btn" data-tab="upload" style="padding:8px 16px;border:none;background:none;color:var(--text-muted);cursor:pointer"><i class="fas fa-upload"></i> อัปโหลดรูป</button>
          <button type="button" class="sig-tab-btn" data-tab="saved" style="padding:8px 16px;border:none;background:none;color:var(--text-muted);cursor:pointer"><i class="fas fa-star"></i> ลายเซ็นที่บันทึกไว้</button>
        </div>

        <!-- Tab 1: Draw -->
        <div class="sig-tab-content" id="sigTabDraw">
          <div class="signature-pad-container" style="border:1px solid var(--border-color);border-radius:8px;background:#fff;overflow:hidden">
            <canvas id="signatureCanvas" width="500" height="200" style="display:block;width:100%;height:200px;touch-action:none;cursor:crosshair"></canvas>
          </div>
          <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center">
            <button type="button" class="btn btn-secondary" id="clearSignature"><i class="fas fa-eraser"></i> ล้าง</button>
            <button type="button" class="btn btn-success" id="confirmSignatureDraw"><i class="fas fa-check"></i> ยืนยันลงนาม</button>
          </div>
        </div>

        <!-- Tab 2: Upload -->
        <div class="sig-tab-content" id="sigTabUpload" style="display:none">
          <div class="form-group">
            <label><i class="fas fa-image"></i> เลือกไฟล์ภาพลายเซ็น (PNG / JPG)</label>
            <input type="file" id="sigFileInput" accept="image/png, image/jpeg, image/jpg" style="margin-top:8px;width:100%">
          </div>
          <div id="sigPreviewWrap" style="display:none;margin-top:16px;text-align:center;padding:16px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px">
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px">ตัวอย่างลายเซ็นที่เลือก:</p>
            <img id="sigImagePreview" style="max-height:120px;max-width:100%;object-fit:contain;background:#fff;border-radius:4px;padding:4px;border:1px solid var(--border-color)">
          </div>
          <div style="margin-top:16px;text-align:right">
            <button type="button" class="btn btn-success" id="confirmSignatureUpload" disabled><i class="fas fa-check"></i> ยืนยันลงนามด้วยภาพนี้</button>
          </div>
        </div>

        <!-- Tab 3: Saved Signature -->
        <div class="sig-tab-content" id="sigTabSaved" style="display:none">
          <div id="savedSigContainer" style="text-align:center;padding:20px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px">
            <div style="color:var(--text-muted);font-size:13px"><i class="fas fa-spinner fa-spin"></i> กำลังโหลดลายเซ็น...</div>
          </div>
          <div style="margin-top:16px;text-align:right">
            <button type="button" class="btn btn-success" id="confirmSignatureSaved" style="display:none"><i class="fas fa-check"></i> ยืนยันลงนามด้วยลายเซ็นนี้</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function togglePw(btn) {
      const input = btn.parentElement.querySelector('input');
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
  <script src="/js/app.js"></script>
</body>

</html>
